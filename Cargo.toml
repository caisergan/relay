[workspace]
resolver = "3"
members = ["crates/relay-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/caisergan/relay"

# Versions resolved and pinned during Phase 0 scaffolding (2026-09-07).
# See docs/adr/004-protocol-compatibility.md before changing a protocol crate.
[workspace.dependencies]
relay-core = { path = "crates/relay-core" }

async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
specta = { version = "=2.0.0-rc.25", features = ["derive", "chrono", "uuid"] }
thiserror = "2.0.20"
tokio = "1.53.1"
tokio-util = "0.7.19"
tracing = "0.1.44"
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[profile.dev.package."*"]
# Dependencies are rebuilt rarely but run constantly during development;
# unoptimised crypto and compression make transfers unusable in dev builds.
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
panic = "unwind" # P5 requires a panic hook + crash dialog; abort is not acceptable.
strip = true
