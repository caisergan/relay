name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Warnings are failures: a lint we tolerate today is one nobody reads tomorrow.
  RUSTFLAGS: -D warnings

jobs:
  # The engine has no GUI dependency, so it is tested where CI is cheapest and
  # fastest. `cargo tree` failing here would mean Tauri crept into the core.
  engine:
    name: Engine (relay-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: The engine must not depend on Tauri
        run: |
          if cargo tree -p relay-core | grep -qi '^\s*[|`-]*\s*tauri'; then
            echo "relay-core has picked up a Tauri dependency"
            cargo tree -p relay-core | grep -i tauri
            exit 1
          fi

      - name: Clippy
        run: cargo clippy -p relay-core --all-targets -- -D warnings

      # The gated tests are not run here — they need a server — but they must still
      # compile. Without this a change to a shared type breaks them, and the only job
      # that notices is the one that has to start docker first, twelve minutes later.
      - name: Feature-gated tests still compile
        run: cargo clippy -p relay-core --all-features --all-targets -- -D warnings

      - name: Tests
        run: cargo test -p relay-core

  # Generated bindings are checked in so the frontend builds without a Rust
  # toolchain; this job is what stops them drifting from the Rust types.
  bindings:
    name: Generated IPC types are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p relay-core --example gen-ipc
      - name: Fail if `pnpm gen:ipc` was not run
        run: git diff --exit-code -- src/ipc/gen.ts

  # Two suites against the same real OpenSSH server. The §0.6 prototypes test the
  # library — they are the reason phase 1 was allowed to start — and the phase 1
  # suite tests Relay's own backend: the auth ladder, trust decisions inside the
  # handshake, the transfer lanes, and finalisation.
  sftp-prototypes:
    name: SFTP against real OpenSSH
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Start the fixture
        run: ./scripts/sftp-fixture.sh up > /dev/null

      # Serial on purpose: one test rotates the server's host key, which every other
      # connection would see.
      - name: Phase 0 prototypes (the library)
        run: |
          eval "$(./scripts/sftp-fixture.sh env)"
          cargo test -p relay-core --features integration --test sftp_prototype \
            -- --test-threads=1 --nocapture

      - name: Phase 1 backend (our code)
        run: |
          eval "$(./scripts/sftp-fixture.sh env)"
          cargo test -p relay-core --features integration --test sftp_integration \
            -- --test-threads=1 --nocapture

      - name: Stop the fixture
        if: always()
        run: ./scripts/sftp-fixture.sh down

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm test
      - run: pnpm build

  # The shell only exists on the platforms Relay ships to. This is the job that
  # actually compiles src-tauri, so a change there is not verified until it runs.
  shell:
    name: Shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is off for now: add `windows-latest` back here to restore it.
        # While it is off, nothing verifies the Windows half of the product — the
        # OpenSSH named-pipe agent, Credential Manager, the `ring` build, and the
        # drawn window controls all stay unproven (ADR 004).
        os: [macos-14]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Clippy (whole workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Engine tests on the shipped platform
        run: cargo test -p relay-core

      # A real bundle, not just a compile check: an app nobody has launched is not
      # evidence that the shell works. Debug profile, because these are for looking
      # at, and unsigned — signing and notarisation are phase 5.
      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        run: pnpm tauri build --debug --bundles app

      - name: Bundle (Windows)
        if: runner.os == 'Windows'
        run: pnpm tauri build --debug --bundles nsis

      # Apple Silicon requires every binary to carry a signature. Without even an
      # ad-hoc one, Gatekeeper reports a downloaded app as "damaged" rather than
      # "unsigned", which sends people to the Trash instead of to the right-click
      # menu. Real signing and notarisation are phase 5; this is the minimum that
      # makes a test build openable.
      - name: Ad-hoc sign the bundle
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - target/debug/bundle/macos/Relay.app
          codesign --verify --verbose target/debug/bundle/macos/Relay.app

      # Zip with ditto: upload-artifact would otherwise flatten the bundle and drop
      # the executable bit, producing something macOS also refuses to open.
      - name: Package the macOS bundle
        if: runner.os == 'macOS'
        run: |
          cd target/debug/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent Relay.app Relay-app.zip

      - name: Upload the macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: relay-macos-aarch64-debug
          path: target/debug/bundle/macos/Relay-app.zip
          retention-days: 14
          if-no-files-found: error

      - name: Upload the Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: relay-windows-x64-debug
          path: target/debug/bundle/nsis/*-setup.exe
          retention-days: 14
          if-no-files-found: error
