[package]
name = "relay-app"
description = "Relay — the Tauri shell. A thin adapter over relay-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The desktop binary links the library; mobile targets would need the cdylib.
name = "relay_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
relay-core.workspace = true

chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
# No feature is enabled speculatively: Tauri's build script requires every one to
# have matching configuration, and an unused capability is attack surface anyway.
tauri = { version = "2.11.5", features = [] }
# The native "Browse…" file picker in the server editor. A webview file input cannot
# give us a real path, and the engine needs one to read the key.
tauri-plugin-dialog = "2.7.3"
# Revealing a finished transfer in Finder or Explorer. Called from a Rust command
# rather than granted to the webview: opening a path is a filesystem action, and the
# engine owns those.
tauri-plugin-opener = "2.5.2"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid.workspace = true
